<!-- Pagination -->
<div class="pagination">
    {% if prevPage  %}
        <a href="{{ request.path }}?page={{ prevPage }}{% if words %}&search={{ words }}{% endif %}{% if tag %}&tag={{ tag }}{% endif %}" class="button previous">Anterior</a>
    {% endif %}
    <div class="pages">
    {% for n in pageRange %}
        <a href="{{ request.path }}?page={{ n }}{% if words %}&search={{ words }}{% endif %}{% if tag %}&tag={{ tag }}{% endif %}" {% if n == activePage %} class="active" {% endif %}>{{n}}</a>
        <!-- <span>&hellip;</span> -->
    {% endfor %}
    </div>
    {% if nextPage %}
        <a href="{{ request.path }}?page={{ nextPage }}{% if words %}&search={{ words }}{% endif %}{% if tag %}&tag={{ tag }}{% endif %}" class="button next">Próxima</a>
    {% endif %}
</div>
