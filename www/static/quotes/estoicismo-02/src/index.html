<!doctype html>
<html>
    <head>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />

        <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
        <title>Socrates.es - Todos los hombres son mortales, Socrates es un hombre, Socrates es mortal.</title>
        <script
            crossorigin="anonymous"
            src="./external/scripts/8frame-1.5.0.min.js"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
            async
            crossorigin="anonymous"
            data-preload-chunks="slam"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
            crossorigin="anonymous"
        ></script>
        <script src="https://unpkg.com/aframe-chromakey-material@1.1.4/dist/aframe-chromakey-material.min.js"></script>

        <style>
            #quoteWrapper {
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                z-index: 1000;
                position: fixed;
                bottom: 20px;
                width: 100%;
                padding: 2.0rem 0;
                font-family: Figtree,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,Noto Sans,sans-serif,"Apple Color Emoji","Segoe UI Emoji",Segoe UI Symbol,"Noto Color Emoji";
                font-feature-settings: normal;
                font-variation-settings: normal
            }

            #quote {
                max-width: 100%;
                background: rgba(0, 0, 0, 0.5);
                color: #ffffff;
            }

            #quote div {
                text-align: center;
                padding: 0 1em 0 1em
            }

            h1, h3 {
                font-weight:300;
            }

            #quoteH1 {
                font-size: 1.4rem;
                line-height: 1.4rem;
            }

            #quoteH3 {
                font-size: 1.0rem;
                line-height: 1.4rem;
            }

        </style>
    </head>
    <body>
        <script src="bundle.js"></script>
        <a-scene
            xrextras-gesture-detector
            landing-page
            xrextras-loading
            xrextras-runtime-error
            renderer="colorManagement:true"
            xrweb="disableWorldTracking: true"
        >
            <a-assets>
                <video
                    id="seneca-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    src="assets/videos/seneca_05_bg_sm22.mp4#t=0.001"
                ></video>

                <video
                    id="epicteto-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    src="assets/videos/epicteto_01_bg_sm22.mp4#t=0.001"
                ></video>

                <video
                    id="marcus-aurelius-1-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    src="assets/videos/marcoaurelio_01_bg_sm22.mp4#t=0.001"
                ></video>

                <video
                    id="marcus-aurelius-2-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    src="assets/videos/marcoaurelio_02_bg_sm22.mp4#t=0.001"
                ></video>
            </a-assets>

            <a-camera
                position="0 4 10"
                raycaster="objects: .cantap"
                cursor="fuse: false; rayOrigin: mouse;"
            >
            </a-camera>

            <a-light
                type="directional"
                intensity="0.5"
                position="1 1 1"
            ></a-light>

            <a-light type="ambient" intensity="1"></a-light>

            <xrextras-named-image-target name="seneca_05" id="seneca">
                <a-entity 
                    id="seneca-target-video-element"
                    xrextras-play-video="video: #seneca-video; canstop: true"
                    geometry="primitive: plane; height: 1.07; width: 0.8;"
                    material="shader: chromakey; src: #seneca-video; color: 0 1 0" 
                >
                </a-entity>
            </xrextras-named-image-target>

            <xrextras-named-image-target name="epicteto_01" id="epicteto">
                <a-entity 
                    id="epicteto-target-video-element"
                    xrextras-play-video="video: #epicteto-video; canstop: true"
                    geometry="primitive: plane; height: 1.07; width: 0.8;"
                    material="shader: chromakey; src: #epicteto-video; color: 0 1 0" 
                >
                </a-entity>
            </xrextras-named-image-target>

            <xrextras-named-image-target name="marcoaurelio_01" id="marcoaurelio_01">
                <a-entity 
                    id="marcoaurelio_01-target-video-element"
                    xrextras-play-video="video: #marcus-aurelius-1-video; canstop: true"
                    geometry="primitive: plane; height: 1.07; width: 0.8;"
                    material="shader: chromakey; src: #marcus-aurelius-1-video; color: 0 1 0" 
                >
                </a-entity>
            </xrextras-named-image-target>

            <xrextras-named-image-target name="marcoaurelio_02" id="marcoaurelio_02">
                <a-entity 
                    id="marcoaurelio_02-target-video-element"
                    xrextras-play-video="video: #marcus-aurelius-2-video; canstop: true"
                    geometry="primitive: plane; height: 1.07; width: 0.8;"
                    material="shader: chromakey; src: #marcus-aurelius-2-video; color: 0 1 0" 
                >
                </a-entity>
            </xrextras-named-image-target>
        </a-scene>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const targets = [
                    "#marcoaurelio_02", "#marcoaurelio_01", "#epicteto", "#seneca" 
                ]
                const videos = [
                    "#marcus-aurelius-2-video", "#marcus-aurelius-1-video", "#epicteto-video", "#seneca-video"
                ]
                const planes = [
                    "#marcoaurelio_02-target-video-element",
                    "#marcoaurelio_01-target-video-element",
                    "#epicteto-target-video-element",
                    "#seneca-target-video-element"
                ]

                for (let index=0; index< targets.length; index++) {
                    const t = document.getElementById(targets[index]);
                    const v = document.querySelector(videos[index]);
                    const p = document.querySelector(planes[index]);    

                    if (!t || !v || !p) {
                        continue;
                    }

                    t.addEventListener('xrextraslost', () => {
                        if (!v.paused) {
                            p.emit('click'); // lets xrextras-play-video reset its internal state
                        }
                        v.pause();
                        v.currentTime = 0;
                    });

                    v.addEventListener("ended", (event) => {
                        p.emit('click'); // lets xrextras-play-video reset its internal state
                        v.currentTime = 0;
                    });
                }
            });
        </script>
    </body>
</html>
