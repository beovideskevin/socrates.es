<!doctype html>
<html>
    <head>
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />

        <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
        <title>Socrates.es - Todos los hombres son mortales, Socrates es un hombre, Socrates es mortal.</title>
        <script
            crossorigin="anonymous"
            src="./external/scripts/8frame-1.5.0.min.js"
        ></script>

        <script
            src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js"
            async
            crossorigin="anonymous"
            data-preload-chunks="slam"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js"
            crossorigin="anonymous"
        ></script>
        <script src="https://unpkg.com/aframe-chromakey-material@1.1.4/dist/aframe-chromakey-material.min.js"></script>
        <script>
            AFRAME.registerComponent('chromakey-video-trigger', {
                schema: {
                    video: { type: 'selector' },
                    videoPlane: { type: 'selector' }
                },
                init: function () {
                    const video = this.data.video;
                    const videoPlane = this.data.videoPlane;
                    const thumbPlane = this.el;

                    thumbPlane.addEventListener('click', () => {
                        thumbPlane.setAttribute('visible', 'false');
                        videoPlane.setAttribute('visible', 'true');
                        video.play().catch((error) => {
                            console.error('Unable to play video:', error);
                            thumbPlane.setAttribute('visible', 'true');
                            videoPlane.setAttribute('visible', 'false');
                        });
                    });
                }
            });
        </script>

        <style>
            #quoteWrapper {
                display: flex;
                align-items: center;
                justify-content: center;
                position: absolute;
                z-index: 1000;
                position: fixed;
                bottom: 20px;
                width: 100%;
                padding: 2.0rem 0;
                font-family: Figtree,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica Neue,Arial,Noto Sans,sans-serif,"Apple Color Emoji","Segoe UI Emoji",Segoe UI Symbol,"Noto Color Emoji";
                font-feature-settings: normal;
                font-variation-settings: normal
            }

            #quote {
                max-width: 100%;
                background: rgba(0, 0, 0, 0.5);
                color: #ffffff;
            }

            #quote div {
                text-align: center;
                padding: 0 1em 0 1em
            }

            h1, h3 {
                font-weight:300;
            }

            #quoteH1 {
                font-size: 1.4rem;
                line-height: 1.4rem;
            }

            #quoteH3 {
                font-size: 1.0rem;
                line-height: 1.4rem;
            }

        </style>
    </head>
    <body>
        <script src="bundle.js"></script>
        <a-scene
            xrextras-gesture-detector
            landing-page
            xrextras-loading
            xrextras-runtime-error
            renderer="colorManagement:true"
            xrweb="disableWorldTracking: true"
        >
            <a-assets>
                <img
                    id="socrates-thumb"
                    src="assets/images/thumbs/socrates_01_play.jpg"
                />
                <img
                    id="diogenes-thumb"
                    src="assets/images/thumbs/diogenes_01_play.jpg"
                />
                <img
                    id="cleantes-thumb"
                    src="assets/images/thumbs/cleantes_01_play.jpg"
                />
                <img
                    id="zenon-thumb"
                    src="assets/images/thumbs/zenon_02_play.jpg"
                />

                <video
                    id="socrates-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    src="assets/videos/socrates_01_bg_sm22.mp4#t=0.001"
                ></video>
                <video
                    id="diogenes-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    src="assets/videos/diogenes_01_bg_sm22.mp4#t=0.001"
                ></video>
                <video
                    id="cleantes-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    src="assets/videos/cleantes_01_bg_sm22.mp4#t=0.001"
                ></video>
                <video
                    id="zenon-video"
                    crossorigin="anonymous"
                    playsinline
                    webkit-playsinline
                    src="assets/videos/zenon_02_bg_sm22.mp4#t=0.001"
                ></video>
            </a-assets>

            <a-camera
                position="0 4 10"
                raycaster="objects: .cantap"
                cursor="fuse: false; rayOrigin: mouse;"
            >
            </a-camera>

            <a-light
                type="directional"
                intensity="0.5"
                position="1 1 1"
            ></a-light>

            <a-light type="ambient" intensity="1"></a-light>

            <xrextras-named-image-target name="socrates_01" id="socrates">
                <a-entity 
                    id="socrates-target-video-element"
                    geometry="primitive: plane; height: 1.07; width: 0.8;"
                    material="shader: chromakey; src: #socrates-video; color: 0 1 0" 
                    visible="false"
                >
                </a-entity>
                <a-entity
                    id="socrates-target-thumb-element"
                    class="cantap"
                    chromakey-video-trigger
                    geometry="primitive: plane; height: 1.07; width: 0.8;"
                    material="shader: flat; src: #socrates-thumb; transparent: true"
                >
                </a-entity>
            </xrextras-named-image-target>

            <xrextras-named-image-target name="diogenes_01" id="diogenes">
                <a-entity 
                    id="diogenes-target-video-element"
                    geometry="primitive: plane; height: 1.07; width: 0.8;"
                    material="shader: chromakey; src: #diogenes-video; color: 0 1 0" 
                    visible="false"
                >
                </a-entity>
                <a-entity
                    id="diogenes-target-thumb-element"
                    class="cantap"
                    chromakey-video-trigger
                    geometry="primitive: plane; height: 1.07; width: 0.8;"
                    material="shader: flat; src: #diogenes-thumb; transparent: true"
                >
                </a-entity>
            </xrextras-named-image-target>

            <xrextras-named-image-target name="cleantes_01" id="cleantes">
                <a-entity 
                    id="cleantes-target-video-element"
                    geometry="primitive: plane; height: 1.07; width: 0.8;"
                    material="shader: chromakey; src: #cleantes-video; color: 0 1 0" 
                    visible="false"
                >
                </a-entity>
                <a-entity
                    id="cleantes-target-thumb-element"
                    class="cantap"
                    chromakey-video-trigger
                    geometry="primitive: plane; height: 1.07; width: 0.8;"
                    material="shader: flat; src: #cleantes-thumb; transparent: true"
                >
                </a-entity>
            </xrextras-named-image-target>

            <xrextras-named-image-target name="zenon_02" id="zenon">
                <a-entity 
                    id="zenon-target-video-element"
                    geometry="primitive: plane; height: 1.07; width: 0.8;"
                    material="shader: chromakey; src: #zenon-video; color: 0 1 0" 
                    visible="false"
                >
                </a-entity>
                <a-entity
                    id="zenon-target-thumb-element"
                    class="cantap"
                    chromakey-video-trigger
                    geometry="primitive: plane; height: 1.07; width: 0.8;"
                    material="shader: flat; src: #zenon-thumb; transparent: true"
                >
                </a-entity>
            </xrextras-named-image-target>
        </a-scene>

        <div id="quoteWrapper">
            <div id="quote" class="">
                <div>
                    <h3 class="" id="quoteH3"></h3>
                    <h1 class="" id="quoteH1"></h1>
                </div>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                quoteH3 = document.getElementById("quoteH3");
                quoteH1 = document.getElementById("quoteH1");

                const targets = [
                    {
                        id: 'socrates',
                        video: 'socrates-video',
                        videoPlane: 'socrates-target-video-element',
                        thumbPlane: 'socrates-target-thumb-element',
                        name: "Sócrates",
                        quote: "Solo sé que no sé nada.",
                    },
                    {
                        id: 'diogenes',
                        video: 'diogenes-video',
                        videoPlane: 'diogenes-target-video-element',
                        thumbPlane: 'diogenes-target-thumb-element',
                        name: "",
                        quote: "",
                    },
                    {
                        id: 'cleantes',
                        video: 'cleantes-video',
                        videoPlane: 'cleantes-target-video-element',
                        thumbPlane: 'cleantes-target-thumb-element',
                        name: "",
                        quote: "",
                    },
                    {
                        id: 'zenon',
                        video: 'zenon-video',
                        videoPlane: 'zenon-target-video-element',
                        thumbPlane: 'zenon-target-thumb-element',
                        name: "",
                        quote: "",
                    }
                ];

                targets.forEach(({ id, video: videoId, videoPlane: videoPlaneId, thumbPlane: thumbPlaneId, name, quote }) => {
                    const target = document.getElementById(id);
                    const video = document.getElementById(videoId);
                    const videoPlane = document.getElementById(videoPlaneId);
                    const thumbPlane = document.getElementById(thumbPlaneId);
                    const 

                    if (!target || !video || !videoPlane || !thumbPlane) {
                        console.error(`Missing video target elements for ${id}`);
                        return;
                    }

                    const showThumb = () => {
                        thumbPlane.setAttribute('visible', 'true');
                        videoPlane.setAttribute('visible', 'false');
                    };

                    target.addEventListener('xrextrasfound', () => {
                        quoteH3.innerHtml = name;
                        quoteH1.innerHtml = quote;
                    });

                    target.addEventListener('xrextraslost', () => {
                        showThumb();
                        video.pause();
                        video.currentTime = 0;
                        quoteH3.innerHtml = "";
                        quoteH1.innerHtml = "";
                    });

                    video.addEventListener('ended', () => {
                        showThumb();
                        video.currentTime = 0;
                    });
                });
            });
        </script>
    </body>
</html>
